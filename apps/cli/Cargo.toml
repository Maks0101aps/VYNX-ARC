[package]
name = "vynxarc-cli"
version = "0.6.0"
edition = "2024"
license = "MIT"

[features]
worker-diagnostics = ["vynx-arc-core/worker-diagnostics"]

[dependencies]
vynx-arc-core = { path = "../../core" }
zeroize = "=1.9.0"

[[bin]]
name = "vynxarc-cli"
path = "src/main.rs"

[[bin]]
name = "vynxarc-worker"
path = "src/worker.rs"

[dev-dependencies]
tempfile = "=3.27.0"
