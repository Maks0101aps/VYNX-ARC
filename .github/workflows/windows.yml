name: Windows build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified local RAR test fixtures
        run: python scripts/fetch-rar-fixtures.py
      - name: Rust MSVC toolchain
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      - name: Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
      - name: Build and tests
        shell: pwsh
        run: |
          scripts/build.ps1 -QtRoot $env:QT_ROOT_DIR
      - name: Dependency security audit
        shell: pwsh
        run: |
          . scripts/env.ps1 -QtRoot $env:QT_ROOT_DIR
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo audit
