name: Windows build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified local RAR test fixtures
        run: python scripts/fetch-rar-fixtures.py
      - name: Rust MSVC toolchain
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          # Released aqt 3.3.0 looks in the pre-6.11 repository layout.
          # Pin upstream's architecture-split repository support until released.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          py7zrversion: '==1.1.3'
          cache: true
          cache-key-prefix: vynx-qt-076e165
      - name: Install pinned audit tool
        shell: pwsh
        run: |
          . scripts/env.ps1 -QtRoot $env:QT_ROOT_DIR
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install packaged verification tools
        run: python -m pip install -r scripts/verification-requirements.txt
      - name: Source gates, native tests and portable packaging
        shell: pwsh
        run: scripts/build-release.ps1 -QtRoot $env:QT_ROOT_DIR -SkipInstaller
      - name: Verify deployed portable, external locks and malformed inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .dev | Out-Null
          $env:VYNX_VERIFY_REPORT = Join-Path $PWD '.dev/ci-portable.json'
          python scripts/verify-portable.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/fuzz-07-targets.py --output .dev/ci-qualification-0.7.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-publication-locks.py --cli target/release/vynxarc-cli.exe --output .dev/ci-locks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-interrupted-rebuild.py --cli target/release/vynxarc-cli.exe --output .dev/ci-interrupted
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/fuzz-parsers.py --cli target/release/vynxarc-cli.exe --cases 64 --output .dev/ci-fuzz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-rar-native.py --cli target/release/vynxarc-cli.exe --output .dev/ci-rar --many-files 1000
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            .dev/ci-portable.json
            .dev/ci-qualification-0.7.json
            .dev/ci-locks/results.json
            .dev/ci-interrupted/results.json
            build-msvc/presentation-tests.txt
            .dev/ci-fuzz/results.json
            .dev/ci-fuzz/case-*.bin
            .dev/ci-rar/results.json
          include-hidden-files: true
